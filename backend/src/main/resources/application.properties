spring.application.name=backend


spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Limit each backend to 2 database connections so teammates can s
spring.datasource.hikari.maximum-pool-size=2

# Keep 1 idle connection ready for database requests.
spring.datasource.hikari.minimum-idle=1


# Start the local Vite frontend when the backend is ready.
# Set FRONTEND_AUTO_START=false for backend-only runs or deployments.
app.frontend.auto-start=${FRONTEND_AUTO_START:true}

# Login session cookie; enable secure cookies when serving over HTTPS.
# Expire the session after 30 minutes without a request.
server.servlet.session.timeout=30m
# Prevent JavaScript from reading the cookie; restrict when browsers send it across sites.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
